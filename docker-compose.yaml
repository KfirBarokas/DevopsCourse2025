version: '3'

services:
  drupal:
    image: drupal:latest
    container_name: drupal
    ports: 
      - 8080:80
    networks:
      - kfir-network
    environment:
      - POSTGRES_DB=table
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password

  postgres:
      image: postgres:latest
      container_name: postgres
      networks:
          - kfir-network
      environment:
          - POSTGRES_DB=table
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=password
    

networks:
    kfir-network: 
        driver: bridge
